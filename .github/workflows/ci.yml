name: CI

# This setup assumes that you run the unit tests with code coverage in the same
# workflow that will also print the coverage report as comment to the pull request.
# Therefore, you need to trigger this workflow when a pull request is (re)opened or
# when new code is pushed to the branch of the pull request. In addition, you also
# need to trigger this workflow when new code is pushed to the main branch because
# we need to upload the code coverage results as artifact for the main branch as
# well since it will be the baseline code coverage.
#
# We do not want to trigger the workflow for pushes to *any* branch because this
# would trigger our jobs twice on pull requests (once from "push" event and once
# from "pull_request->synchronize")
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'

jobs:
  # Fast feedback loop. Runs gofmt + go vet + go test in a hermetic
  # sandbox (no network access required) using the in-memory fixtures
  # provided by common/testutil. This is the job that catches flaky
  # tests and external network dependencies before they reach the
  # coverage job.
  unit_tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ^1.22

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Verify formatting
        run: |
          # gofmt is the first gate; we don't -w in CI because we want
          # to surface formatting drift loudly rather than silently
          # rewriting history on every push.
          diff_out=$(gofmt -s -d .)
          if [ -n "$diff_out" ]; then
            echo "::error::gofmt produced diffs:"
            echo "$diff_out"
            exit 1
          fi

      - name: Static analysis
        run: go vet ./...

      - name: Run unit tests
        # -race catches data races in testutil's parallel helpers.
        # -count=1 defeats any local build cache so flake-watchers
        # see the real run.
        # -p parallelism follows GOMAXPROCS so SQLite temp files don't
        # thrash; tests themselves still call t.Parallel() internally.
        run: go test -race -count=1 -timeout 90s ./...

      # Coverage is uploaded as a separate job below so that a flaky
      # coverage report does not block the green/red signal of
      # unit_tests.
      - name: Generate coverage
        run: go test -cover -coverprofile=coverage.txt ./...
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  commit_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: wagoid/commitlint-github-action@v6